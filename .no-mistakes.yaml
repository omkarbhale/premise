# The checks every change to premise passes, in the no-mistakes pipeline (decision 0131).
# .github/workflows/ci.yml runs the same npm scripts.
# Tests never call Claude or any LLM and never touch the network or GitHub (decision 0134).
commands:
  lint: "(test -d node_modules || npm ci --no-audit --no-fund) && npm run lint && npm run typecheck"
  test: "(test -d node_modules || npm ci --no-audit --no-fund) && npm run build && npm test"

test:
  instructions: |
    Install with `npm ci` if node_modules is missing; then `npm run build` and `npm test`.
    Never use a Claude login, an API key, or any LLM in tests: agents are scripted (agents.mode "scripted").
    Never create GitHub repositories or reach the network from tests; use temporary folders and local git remotes only.
